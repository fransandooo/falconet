[workspace]
resolver = "3"
members = [
    "crates/*",     # the product: falconet-* crates
    "playground/*", # phase 0 learning exercises, not part of the product
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fransandooo/falconet"
authors = ["Francisco Sandoval"]

[workspace.dependencies]
burn = { version = "0.22.1", default-features = true }
clap = { version = "4.6.7", features = ["derive", "env"] }
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "webp"] }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = { version = "3.5.2", default-features = false, features = ["json"] }

falconet-mlflow = { path = "crates/falconet-mlflow" }

# Burn is painfully slow without optimizations, so dependencies are always
# compiled with opt-level 3 even in debug builds. Our own code stays at the
# debug default so it keeps fast incremental builds and good debug info.
# Dependencies skip debug info: it is most of `target/`'s size, and we don't
# step into Burn's internals with a debugger.
[profile.dev.package."*"]
opt-level = 3
debug = false
